# devices/stc/stc32g12k128.toml
# STC STC32G12K128 —— 251 兼容核；128K Flash / 12K SRAM（2K edata + 10K xdata）。
# 定位：与 STC8/STC8051 外设互通，仅内核换成 251（换编译器即可）。
# 已核（手册 11.1）：复位入口/向量 = FF:0000；128K Flash = FE:0000–FF:FFFF。
# 本工具链单段链接用顶部 64K；SRAM 划分部分仍待核。

[device]
id = "stc/stc32g12k128"
vendor = "STC"
family = "stc32"
model = "STC32G12K128"
package = "LQFP48"
doc = "STC32G-20260709.md"
sfr_source = "../../tools/vendor/stc/keil/c251/STC32G.H"

[code]
# STC32G12K128：Flash 逻辑地址 FE:0000–FF:FFFF（128K），**复位入口/向量在 FF:0000**
# （STC32G 手册 11.1）。故代码基址 = 0xFF0000。单段链接只覆盖顶部 64K
# （FF:0000–FF:FFFF，`--code-size 0x10000`）；FE:0000 的下半 64K 需拆分链接（未来）。
base = 0xff0000
size = 0x10000                 # 顶部 64K；全 128K 见上方注释
addr_width = 24
movc = true
reset_vector = 0xff0000
wait_states = 1

[[memory]]
kind = "data"
base = 0x0000
size = 0x0080
addressing = "direct"
bit_addressable = true

[[memory]]
kind = "idata"
base = 0x0080
size = 0x0080
addressing = "indirect_r0"

[[memory]]
kind = "edata"                 # 251 直接/间接 on-chip（4K）
base = 0x0000
size = 0x1000
addressing = "movx_dptr"
alias_of = "data"

[[memory]]
kind = "xdata"                 # 片内扩展 xdata（8K）
base = 0x010000
size = 0x2000
addressing = "movx_dpx"

[[memory]]
kind = "xfr"
base = 0x7E0000
size = 0x10000
mode = "dpx_window"
enable = "P_SW2.EAXFR"

[[memory]]
kind = "eeprom"
base = 0xff0000                 # IAP EEPROM 位于 Flash 内；单段上限用顶部 64K
size = 0x10000
page = 512
in_flash = true
iap = true

[stack]
space = "edata"
top = 0x0100                   # TODO: 待核

[link]
data_loc = 0x30
idata_loc = 0x80

[dptr]
count = 2
extended = "DPXL"

[registers]
SP = 0x81
SPH = 0x85
DPL = 0x82
DPH = 0x83
DPXL = 0x84
AUXR = 0x8E
AUXR2 = 0x97
P_SW2 = 0xBA

[register_bits]
"P_SW2.EAXFR" = 7
"AUXR.EXTRAM" = 1

[interrupts]
vector_base = 0xff0000         # 向量在 FF:0000 区（手册 11.1）
slot_bytes = 8
formula = "num*8+3"
max_number = 67
priority_levels = 4
numbering = "linear_gt31"
