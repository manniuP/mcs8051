name: Build both compiler branches (portable)

# Build the Windows portable toolchain for BOTH compiler submodule refs in one run:
#   compiler@mcs251-backend  -> mcs8051-portable-mcs251-backend.zip
#   compiler@opt-tags        -> mcs8051-portable-opt-tags.zip
#
# Each matrix job pins the `compiler` submodule to the given ref, builds the backend,
# then runs the same portable pipeline as portable.yml (SDCC + PyInstaller + smoke build).

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-both.yml'
      - 'examples/**'
      - 'lib/**'
      - 'tools/**'

permissions:
  contents: read

concurrency:
  group: build-both-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: portable (${{ matrix.ref }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ref: [mcs251-backend, opt-tags]

    steps:
      - name: Check out sources (without submodules)
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Fetch compiler submodule @ ${{ matrix.ref }}
        shell: pwsh
        run: |
          git submodule update --init compiler
          git -C compiler fetch origin ${{ matrix.ref }}
          git -C compiler checkout --detach FETCH_HEAD
          git -C compiler log --oneline -1

      - name: Set up Zig 0.16.0 (host compiler)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build the MCS backend
        shell: pwsh
        working-directory: compiler
        run: zig build -Doptimize=ReleaseFast -Dno-lib -Dmcs-only --zig-lib-dir lib

      - name: Download prebuilt Windows SDCC
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path sdcc-dl | Out-Null
          gh release download v4.6.0-mcs251-20260804 `
            --repo gevico/sdcc-c251 --pattern "*.zip" --dir sdcc-dl
          New-Item -ItemType Directory -Force -Path tools\sdcc-mcs251-windows-x64 | Out-Null
          Expand-Archive -Path (Get-ChildItem sdcc-dl\*.zip).FullName `
            -DestinationPath tools\sdcc-mcs251-windows-x64 -Force
          Get-ChildItem tools\sdcc-mcs251-windows-x64 | Select-Object -First 5 Name

      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller

      - name: Generate the portable package
        shell: pwsh
        run: .\tools\make_portable.ps1 -Out "${{ github.workspace }}\portable"

      - name: Smoke-build the portable examples
        shell: pwsh
        working-directory: portable
        run: .\build.cmd all

      - name: List produced images
        shell: pwsh
        run: Get-ChildItem -Recurse -Filter *.ihx portable | Select-Object FullName, Length

      - name: Package as zip
        shell: pwsh
        run: Compress-Archive -Path portable -DestinationPath "mcs8051-portable-${{ matrix.ref }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcs8051-portable-${{ matrix.ref }}
          path: mcs8051-portable-${{ matrix.ref }}.zip
          archive: false
          retention-days: 30
